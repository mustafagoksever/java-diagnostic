# ASELSAN ESM DIAGNOSTIC — SUNUCU KONFİGÜRASYONU
# Fotoğraflardaki 14 kaynak salt okunur collector şemasına uyarlandı.
# UTF-8 YAML dosyasıdır; # satırları açıklamadır. Windows yollarını tek
# tırnakla yazın; / veya \ kullanılabilir. Alan adları sabittir.
# Collector süreçleri listede görünür; dump/GC/kaynak hedeflerine alınmaz.
# Genel örnekler için yanındaki config.example.yaml dosyasına bakın.

# mode: remote=uzak sunucu (varsayılan), local=bu bilgisayar.
# Admin ekranından oturumluk değiştirilebilir; CLI: --local/--remote.
applicationTitle: 'Aselsan ESM diagnostic'     # Normal ve admin pencerelerinin başlığı.
mode: remote

# ZIP parolası yalnız burada tanımlıdır; sunucu giriş parolasından ayrıdır.
# Gömülü config JAR içinden çıkarılabilir. Değeri log/manifest içine yazılmaz.
zipPassword: 'Aselsan123Radar'

# remote: sunucu bağlantısı. Mevcut WMI/DCOM ve SMB erişimleri kullanılır.
# Sunucuya servis/ajan/JAR kurulmaz; kendi geçici script/çıktıları temizlenir.
# Kullanıcı adı ve parola burada YAZILMAZ; Swing ekranında oturumluk girilir.
# CLI kullanıcı adı --user veya konsoldan; parola konsol veya ortamdan alınır.
remote:
  # Windows sunucusunda salt okunur IP/soket/rota/ARP, süreç/servis/sürücü,
  # oturum, saat servisi ve son 48 saatten System/Application olaylarını toplar.
  # Çıktı: ZIP içinde server/SONUC.txt; listeleme sırasında çalışmaz.
  windowsDiagnostics: true
  host: '15.30.9.176'                         # Sunucu IPv4 adresi veya DNS adı.
  jdkHome: auto                              # SUNUCUDA JDK keşfi; PATH, JAVA_HOME, kayıt defteri ve hedef JVM klasörleri.
  # Sabit aday örneği: jdkHome: 'C:/Program Files/Java/jdk1.8.0_281'
  # PID'nin sürüm/mimari uyumu önce gelir; diğer uygun JDK'lar da denenebilir.
  timeoutSeconds: 1800                       # Tüm uzak toplama limiti, 60–7200 s.
  # Sunucudaki geçici işler önce C:/Temp, alan/erişim yoksa D:/Temp altındadır.
  # Başlangıçta en az 320 MiB gerekir (256 MiB rezerv + 64 MiB çalışma payı).
  # auto: C için Temp/C$, D için Temp/DTemp/D$ paylaşımı denenir.
  # Paylaşımın seçilen diskteki Temp klasörünü kapsaması gerekir.
  # Standart kullanıcı için örnek: workShare: 'Temp'. Paylaşım ve WMI/DCOM
  # yetkileri sunucuda önceden verilmiş olmalıdır. Collector bunları oluşturmaz.
  workShare: auto
  # Loglar kopyalanmadan önce SUNUCUDA çalıştırılır; uygulama köküne göre yol.
  # Örnek: <applicationDirectory>/Log/kaydal.bat. Çalışma klasörü Log olur.
  # BAT'ın bitmesi ve exit code=0 gerekir; hata/timeout varsa log kopyalanmaz,
  # mevcut dump/sistem verileriyle PARTIAL rapor oluşur. Listelemede çalışmaz.
  # Bu BAT kendi içeriğine göre kaynak dosyaları değiştirebilir.
  # nircmd kullanan BAT, açık uygulamanın kullanıcı oturumunda tek seferlik
  # görevle çağrılır. Görevde parola saklanmaz; görev işlem sonunda silinir.
  # Aynı hesapla açık, kilitsiz Windows/RDP oturumu ve görev oluşturma izni gerekir.
  # Devre dışı bırakma örneği: beforeLogCopyBatch: ''
  beforeLogCopyBatch: 'Log/kaydal.bat'
  beforeLogCopyTimeoutSeconds: 120           # BAT limiti, 1–600 saniye.
  beforeLogCopyDelaySeconds: 30              # BAT başarıyla bittikten sonra bekle, 0–300 s.
  # Ping SUNUCUDAN gönderilir; yerel bilgisayardan hedeflere gönderilmez.
  # enabled: false kapatır. Yanıt alınamaması bir tanılama bulgusudur,
  # tek başına collector hatası veya cihazın kapalı olduğunun kanıtı değildir.
  ping:
    enabled: true
    subnet: '15.30.9.0/24'                   # .1–.254 taranır; .0 ağ ve .255 broadcast hariç. /24–/30 desteklenir.
    addresses: []                           # İsteğe bağlı ek IPv4'ler; örnek: ['15.30.10.20']. Aynı IP bir kez taranır.
    # Yalnız liste için subnet satırını kaldırın: addresses: ['15.30.9.176', '15.30.9.198'].
    # subnet + addresses toplam en fazla 512 farklı hedef. DNS adı kabul edilmez.
    parallelism: 16                          # Aynı anda en fazla 1–32 IP; tarama SUNUCUDA çalışır.
    attempts: 1                            # Her IP'ye istek sayısı, 1–10. 1 hızlı keşif; 4 paket kaybı takibi.
    timeoutMillis: 1000                     # Tek ICMP isteği limiti, 100–5000 ms.
    intervalMillis: 0                       # Aynı IP'deki istekler arası, 0–1000 ms; attempts: 1 ise beklemez.
    # Ağ taramasında 254 ayrı dosya yerine ping/SONUC.txt, results.csv ve results.json yazılır.
  # VxWorks SUNUCUDAKİ seri portlardan okunur. Yerel modda/listelemede çalışmaz.
  # enabled: false kapatır. Port meşgulse devralınmaz. DTR ve RTS kapalıdır.
  # İstemden sonra version okunur; VxWorks sürüm başlığı yoksa başka komut gönderilmez.
  # i listesindeki her TASKID için tt 0xTASKID ve ti 0xTASKID denenir.
  # IP/MAC sorgusundan sonra, i listesinden önce TatlYaz bir kez gönderilir.
  # TatlYaz istemi döndükten sonra 3 saniye daha okunur; geç gelen çıktı aynı dosyaya yazılır.
  # Çıktı: vxworks/ports/port-COM*/custom-command.txt; desteklenmezse hata kaydedilip devam edilir.
  # tt=stack trace; ti=task/stack/register ayrıntısı. Kernel korumaları aşılmaz.
  # Native trace/soket desteği yoksa neden kaydedilir ve rapor PARTIAL olabilir.
  # Ek sorgular: checkStack 0, taskShow 0,2, devs, whoami, w; PEND task'larda tw 0xTASKID.
  # memShow 0 mevcut ağ/bellek adımındadır; aynı portta iki kez çalıştırılmaz.
  # checkStack stack belleğini tarar; ek komutlar port/genel süre limitini uzatmaz.
  # '.', görev durdurma/silme ve sayaç sıfırlama komutları gönderilmez.
  vxworks:
    enabled: true
    autoDiscoverPorts: true                 # Sunucuda kayıtlı tüm COM portlarını otomatik bul ve sırayla dene.
    ports: []                               # Otomatik keşifte kullanılmaz. Manuel örnek: autoDiscoverPorts: false, ports: ['COM7', 'COM17'].
    # Manuel listede en fazla 64 port; port adları COM1–COM65535 aralığındadır.
    # Otomatik keşif yalnız sunucuda çalışır; bu bilgisayarın portlarına bağlanmaz.
    baudRate: 115200                        # Seri hız, 110–921600; sürücü desteklemeli.
    dataBits: 8                             # Veri bitleri, 5–8.
    stopBits: 1                             # Stop bitleri, 1 veya 2.
    parity: None                            # None/Odd/Even/Mark/Space.
    flowControl: None                       # Bu sürümde yalnız None desteklenir.
    portTimeoutSeconds: 180                 # Bir portun tüm işlemleri, 15–600 s.
    commandTimeoutSeconds: 10               # Tek komut/istem, 1–60 s; port limitinden kısa.
    customCommand: 'TatlYaz'                  # Cihaza özel komut simgesi; boş metin kapatır.
    customCommandDelaySeconds: 3              # İlk istemden sonra ek okuma, 0–10 saniye.
    maxOutputMb: 8                          # Bir portun konsol çıktı sınırı, 1–64 MiB.

# installationDirectory: kurulum kökü; gomulu bu kökün altındadır.
# Uzak modda sunucudaki mutlak sürücü yolu gerekir. Yerel modda göreli yol YAML klasörüne göredir.
installationDirectory: 'C:/aselsan/ares2n'

# applicationDirectory: plugins ve Log klasörlerinin bulunduğu uygulama kökü.
# auto: önce <kurulum>/uygulama; yoksa kökte plugins/Log varsa kurulum kökü.
# Hiçbiri yoksa <kurulum>/uygulama varsayılır; eksikler toplamada kaydedilir.
# Sabit örnek: 'C:/aselsan/ares2n/uygulama'; '.'=doğrudan kurulum kökü.
# Göreli yol installationDirectory'ye göre çözülür.
applicationDirectory: auto

# outputDirectory: BU BİLGİSAYARDA şifreli ZIP'lerin yazılacağı klasör.
# Uzak modda log/installation/application yolları ise SUNUCUDA çözülür.
# Göreli yol YAML klasörüne göredir. Örnek: 'C:/DiagnosticReports'.
outputDirectory: 'C:/aselsan'

# collectionDelaySeconds: rapor düğmesi/collect komutundan sonra keşif öncesi
# bekleme (saniye). 0=bekleme yok; aralık 0–300. Fotoğraftaki bekleme: 10.
collectionDelaySeconds: 10

# commandTimeoutSeconds: her jcmd/jstack/jps/jstat ve PID kimlik kontrolü
# için ayrı timeout (saniye); aralık 1–300. Örnek: 30.
# Timeout yalnız yardımcı komutu kapatır; hedef JVM'yi kapatmaz.
commandTimeoutSeconds: 20

# scanTimeoutSeconds: Windows keşfi/sistem bilgisi timeout'u (saniye);
# aralık 1–600. Kaynak takibine de ek timeout payı verir. Örnek: 90.
scanTimeoutSeconds: 60

# resourceMonitoringSeconds: eş zamanlı CPU/RAM/disk hızı takip süresi.
# 60=bir dakika; 0=takip kapalı; aralık 0–300. Örnek: 120.
# Anlık sistem özeti takip kapalıyken de alınır.
resourceMonitoringSeconds: 60

# resourceSampleIntervalSeconds: örnekler arası hedef bekleme (saniye);
# aralık 1–10. Sorgu süresi gerçek aralığı uzatabilir. Örnek: 5.
# Gerçek zamanlar kaynak-izleme.csv dosyasında bulunur.
resourceSampleIntervalSeconds: 1

# jdkHomes: toplama yapılan bilgisayarda ek JDK aday kökleri. []=ek kök yok.
# Yerel/uzak otomatik keşif hedef Java/jvm.dll, JAVA_HOME/JDK_HOME, PATH,
# kayıt defteri ve vendor klasörlerini kullanır. Yerelde collector JDK'sı da eklenir.
# PID'ye göre mimari/sürüm uyumu önce gelir; sıra kesin zorlaması değildir.
# En fazla 3 uygun kök/örnek; ortak bütçe 2 x commandTimeoutSeconds.
# Örnek (aşağıdaki [] yerine):
# jdkHomes:
#   - 'C:/Java/jdk8'
#   - 'D:/PortableJava/jdk8'
jdkHomes: []

# additionalProcessNames: Java barındıran özel wrapper exe adları; tam yol
# değil süreç adı yazılır. Modülleri okunamayan wrapper'lar için faydalıdır.
# Örnek: ['ares.exe', 'osgi-service.exe']. Her ad .exe ile bitmelidir.
additionalProcessNames: []

# collectGcStats: true=jstat -gcutil ile bir GC istatistik örneği dene;
# false=GC istatistiğini atla. Hiçbir durumda zorla GC çalıştırılmaz.
collectGcStats: true

# logs: toplanacak dizinler veya tek dosyalar. Hepsi yalnızca kopyalanır.
# Her girdi için alan açıklamaları ve örnekler:
# base: göreli path'in kökü. installation=installationDirectory,
#       application=applicationDirectory, config=yerelde YAML klasörü;
#       uzakta installationDirectory (sunucuya YAML kopyalanmaz).
# path: kaynak dizin veya tek dosya. Mutlak yol verilirse base kullanılmaz.
#       Örnek dizin: 'Log'; tek dosya: 'plugins/ornek/conf/settings.xml'.
# destination: ZIP içinde logs/ altındaki hedef klasör. Yoksa 01, 02...
#              kullanılır. Örnek: 'KA/log'. Mutlak yol ve .. yasaktır.
#              Aynı hedef dosyaya iki kaynak denk gelirse ilk kopya korunur.
# recursive: true=alt klasörleri tara; false=yalnız üst klasör.
#            Varsayılan true; tek dosya kaynaklarında etkisizdir.
# extensions: []=tüm uzantılar; örnek: ['.log', '.txt', '.out'].
#             Nokta zorunlu; büyük/küçük harf ayrımı yok. XML: ['.xml'].
# modifiedWithinHours: son kaç saatte değiştirilmiş dosyalar alınacak.
#                      0=tarih filtresi kapalı; varsayılan 48;
#                      aralık 0–87600. Örnek: 24 (son bir gün).
# maxFileSizeMb: dosya başına MiB sınırı (1024*1024 byte). Aşan dosya tamamen
#               atlanır; kesilmez. Varsayılan 100; aralık 1–10240. Örnek: 50.
# Son 48 saat ve 100 MiB sınırları fotoğraftan alınmadı; değiştirilebilir.
logs:
  # Kimliklendirme iz kayıtları: son 48 saat.
  - {base: installation, path: 'gomulu/Kimliklendirme/iz', destination: 'Kimliklendirme/iz', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Kimliklendirme ayarları: tarih filtresi kapalı.
  - {base: installation, path: 'gomulu/Kimliklendirme/config', destination: 'Kimliklendirme/config', recursive: true, extensions: [], modifiedWithinHours: 0, maxFileSizeMb: 100}
  # Ortak gömülü veriler: son 48 saat.
  - {base: installation, path: 'gomulu/Gomulu_Ortak/data', destination: 'Gomulu_Ortak', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Tek XML dosyası örneği: eski tarihli ayarlar da alınır.
  - {base: application, path: 'plugins/denizEDKA/conf/EDKA_conf.xml', destination: 'KA/denizEDKA/conf', extensions: [], modifiedWithinHours: 0, maxFileSizeMb: 100}
  # RadehModel ayarları: tarih filtresi kapalı.
  - {base: application, path: 'plugins/RadehModel/conf', destination: 'KA/RadehModel/conf', recursive: true, extensions: [], modifiedWithinHours: 0, maxFileSizeMb: 100}
  # Yayın kayıtları: 100 MiB üzeri dosyalar atlanır.
  - {base: application, path: 'plugins/yayinKaydi/kayitlar', destination: 'KA/yayinKaydi', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Alkon kayıt/log dosyaları.
  - {base: installation, path: 'gomulu/Alkon/log/Kayit', destination: 'Alkon/log', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Alkon ayarları: tarih filtresi kapalı.
  - {base: installation, path: 'gomulu/Alkon/config', destination: 'Alkon/config', recursive: true, extensions: [], modifiedWithinHours: 0, maxFileSizeMb: 100}
  # AlkonAB ayarları: tarih filtresi kapalı.
  - {base: installation, path: 'gomulu/AlkonAB/config', destination: 'AlkonAB/config', recursive: true, extensions: [], modifiedWithinHours: 0, maxFileSizeMb: 100}
  # AlkonAB logları.
  - {base: installation, path: 'gomulu/AlkonAB/log', destination: 'AlkonAB/log', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # SISKI ayarları: tarih filtresi kapalı.
  - {base: installation, path: 'gomulu/SISKI/config', destination: 'SISKI/config', recursive: true, extensions: [], modifiedWithinHours: 0, maxFileSizeMb: 100}
  - {base: installation, path: 'gomulu/TaktikKayitYKBKurulum/data/kayit', destination: 'AlkonAB/kayit', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Tek debug metni: KA/log içine kopyalanır.
  - {base: application, path: 'plugins/OrtakKutuphane/conf/denized_debug.txt', destination: 'KA/log', extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Log klasörü debug metniyle aynı hedefi paylaşır. Dosya adı çakışması
  # manifestte DESTINATION_COLLISION olarak kaydedilir; dosya ezilmez.
  - {base: application, path: 'Log', destination: 'KA/log', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
  # Sunucudaki ek ED log dizini: mutlak yol, alt klasörler dahil.
  # ZIP hedefi logs/ED/Log; son 48 saat, dosya başına 100 MiB, tüm uzantılar.
  - {base: installation, path: 'C:/_Kayit/ED/Log', destination: 'ED/Log', recursive: true, extensions: [], modifiedWithinHours: 48, maxFileSizeMb: 100}
# Config dosyalarına zaman filtresi uygulanmaz; log/veri için son 48 saat seçilir.
# TASI işlemi uygulanmaz; kaynaklar yalnızca kopyalanır.
# Fotoğraftaki Log/kaynak.bat dahil hiçbir kaynak script otomatik çalıştırılmaz.
# Parola YAML'da saklanmaz.
# CLI alternatifleri: --generate-password veya --password-env DEGISKEN_ADI.
